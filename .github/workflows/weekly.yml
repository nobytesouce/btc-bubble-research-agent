name: Weekly BTC research
on:
  schedule:
    - cron: "37 6 * * 0"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        date: ["2020-03-15", "2021-05-19", "2022-11-09", "2024-03-05"]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[cloud]"
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        run: python -m btc_bubble demo --date "${{ matrix.date }}" --max-rows 1000000 --output-dir reports
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ matrix.date }}
          path: reports/
          retention-days: 14
