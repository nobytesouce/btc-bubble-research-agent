name: Daily BTC research
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date (YYYY-MM-DD); defaults to two days ago"
        required: false
permissions:
  contents: read
concurrency:
  group: daily-btc-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[cloud]"
      - name: Select date
        id: date
        shell: bash
        run: echo "value=${{ inputs.date || '' }}" >> "$GITHUB_OUTPUT"; if [ -z "${{ inputs.date || '' }}" ]; then echo "value=$(date -u -d '2 days ago' +%F)" >> "$GITHUB_OUTPUT"; fi
      - name: Run read-only research
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        run: python -m btc_bubble demo --date "${{ steps.date.outputs.value }}" --max-rows 500000 --output-dir reports
      - uses: actions/upload-artifact@v4
        with:
          name: btc-bubble-${{ steps.date.outputs.value }}
          path: reports/
          retention-days: 14

