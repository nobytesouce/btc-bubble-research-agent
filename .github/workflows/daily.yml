name: Daily BTC research
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date (YYYY-MM-DD); defaults to two days ago"
        required: false
permissions:
  contents: read
concurrency:
  group: daily-btc-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[cloud]"
      - name: Select date
        id: date
        shell: bash
        run: |
          if [ -n "${{ inputs.date || '' }}" ]; then
            echo "value=${{ inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(date -u -d '2 days ago' +%F)" >> "$GITHUB_OUTPUT"
          fi
      - name: Run next-bubble forecast
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        run: python -m btc_bubble forecast --date "${{ steps.date.outputs.value }}" --max-rows 500000 --output-dir reports
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: btc-bubble-${{ steps.date.outputs.value }}
          path: reports/
          retention-days: 14
