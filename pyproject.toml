[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-bubble-research"
version = "0.1.0"
description = "Read-only BTC market-microstructure research and backtesting agent"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
]

[project.optional-dependencies]
cloud = [
  "huggingface-hub>=0.32,<2",
  "pyarrow>=16,<22",
]
dev = ["pytest>=8,<10"]

[project.scripts]
btc-bubble = "btc_bubble.cli:main"

[tool.setuptools.packages.find]
include = ["btc_bubble*"]

